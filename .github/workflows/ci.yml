name: CI

# Checks that the firmware, Panel Studio and the web UI can be built and tested on
# Windows, Linux and macOS. GitHub-hosted runners only: no secrets, no hardware, no
# deployment. Hardware tests stay in hil-test.yml (self-hosted, never for pull requests).
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: "Firmware + Panel Studio · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-${{ runner.arch }}-ci-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ci-pio-

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install host C++ compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v g++ >/dev/null; then
            choco install mingw --no-progress -y
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Panel Studio dependencies (PlatformIO, esptool, PySide6, pyserial)
        run: python -m pip install -r desktop/requirements.txt

      - name: Build and verify epd13 with the Panel Studio workflow
        working-directory: desktop
        run: python -m panel_studio.firmware_cli build

      - name: Build epd7
        run: python -m platformio run --environment epd7

      - name: Host tests
        run: |
          python tests/run_serial_console_host.py
          python tests/run_partial_overlay_host.py

      - name: Panel Studio tests
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}
          path: .pio/logs
          if-no-files-found: ignore

  web:
    name: "Web UI · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            profiler/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build profiler
        working-directory: profiler
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install web test dependencies
        shell: bash
        run: |
          python -m pip install -r webtest/requirements.txt
          if [ "$RUNNER_OS" = Linux ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Web UI tests against the simulated device
        run: python -m pytest webtest -v -p no:cacheprovider
